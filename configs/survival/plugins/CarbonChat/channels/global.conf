# BeezzLand chat channel.
key="carbon:global"
format {
    basic {
        # one format for everyone: the badge, nick colour and hover card come from the display name (BeezzCore)
        "default_format"="<#FACC15>[Г]</#FACC15> <display_name><dark_gray>:</dark_gray> <white><message></white>"
        console="[global] <username>: <message>"
        discord="<message>"
    }
}
quick-prefix="!"
should-register-commands=true
command-aliases=[]
radius=-1
empty-radius-recipients-message=true
cooldowns {}
cooldown=-1
cross-server=false
