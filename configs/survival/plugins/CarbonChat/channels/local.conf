# BeezzLand chat channel.
key="carbon:local"
format {
    basic {
        # one format for everyone: the badge, nick colour and hover card come from the display name (BeezzCore)
        "default_format"="<gray>[Л]</gray> <display_name><dark_gray>:</dark_gray> <white><message></white>"
        console="[local] <username>: <message>"
        discord="<message>"
    }
}
quick-prefix=""
should-register-commands=true
command-aliases=[]
radius=100
empty-radius-recipients-message=true
cooldowns {}
cooldown=-1
cross-server=false
