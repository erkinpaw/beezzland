<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Карта мира — BeezzLand</title>
  <link rel="icon" href="assets/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Press+Start+2P&display=swap&subset=cyrillic" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script>
    // Design options: ?theme=meadow|retro|night (remembered), ?theme=hive = original.
    (function () {
      var q = new URLSearchParams(location.search), t = q.get("theme");
      try {
        if (!t) t = localStorage.getItem("beezz-theme");
        else if (!q.has("preview")) localStorage.setItem("beezz-theme", t);
      } catch (e) {}
      if (t && t !== "hive" && /^[a-z]+$/.test(t)) {
        document.documentElement.dataset.theme = t;
        document.write('<link rel="stylesheet" href="themes/' + t + '.css">');
      }
    })();
  </script>
</head>
<body class="map-page">
<header class="top">
  <div class="wrap">
    <a class="brand" href="/"><img class="px" src="assets/bee.svg" alt=""><span>Beezz<b>Land</b></span></a>
    <nav>
      <a class="hide-sm" href="/map/?v=pl3xmap" target="_blank" rel="noopener">На весь экран ↗</a>
      <a class="hide-sm" href="/">Главная</a>
      <a class="on" href="map.html">Карта</a>
      <a href="duels.html">Дуэли</a>
      <a href="bans.html">Банлист</a>
      <a class="hide-sm" href="calculator.html">Калькулятор</a>
      <a href="shop.html">Донат</a>
      <a href="profile.html">Кабинет</a>
    </nav>
  </div>
</header>
<div class="map-frame" data-frame>
  <!-- ?v= changes when the map plugin changes, so browsers drop the old cached app -->
  <iframe src="/map/?v=pl3xmap" title="Карта мира BeezzLand" allowfullscreen></iframe>
  <div class="fallback"><div><h2>Карта спит 🐝</h2><p>Сервер карты сейчас недоступен. Загляни чуть позже.</p></div></div>
</div>
<script>
  fetch("/map/tiles/settings.json", { cache: "no-store" })
    .then(r => { if (!r.ok) throw 0; })
    .catch(() => document.querySelector("[data-frame]").classList.add("down"));
</script>
</body>
</html>
