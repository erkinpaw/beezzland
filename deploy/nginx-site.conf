# BeezzLand site: nginx in front of site/server.py (127.0.0.1:8080).
# @DOMAIN@ is replaced by setup.sh; certbot adds the HTTPS server block.
server {
    listen 80;
    listen [::]:80;
    server_name @DOMAIN@ www.@DOMAIN@;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # live map updates are a server-sent event stream: no buffering, long timeout
    location /map/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_set_header Host $host;
    }

    location ~* \.(png|svg|css|js)$ {
        proxy_pass http://127.0.0.1:8080;
        expires 1h;
    }
}
