name: BeezzCore
version: '${version}'
main: land.beezz.core.BeezzCore
api-version: '26.3'
description: BeezzLand — приветствие, /rules, /links, подсказки, карточка игрока, AFK и лимит пластинок
softdepend: [LuckPerms, PlaceholderAPI]
folia-supported: true

commands:
  rules:
    description: Правила сервера
  links:
    description: Сайт и соцсети сервера
    aliases: [site, discord, vk, tg]
  discs:
    description: Сколько своих пластинок осталось в этом сезоне
  color:
    description: Свой цвет ника (Gold) или градиент (Diamond)
    aliases: [nickcolor]
  beezzcore:
    description: Перечитать config.yml
    permission: beezzcore.admin

permissions:
  beezzcore.admin:
    default: op
  beezz.nick.color:
    description: Свой цвет ника (Gold)
    default: op
  beezz.nick.gradient:
    description: Градиент ника из 2–4 цветов (Diamond)
    default: op
  beezz.afk.unlimited:
    description: Не кикать за AFK
    default: op
