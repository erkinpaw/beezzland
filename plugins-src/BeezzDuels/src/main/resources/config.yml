# Жужики — валюта сайта. Только зарабатываются (вход каждый день, ивенты), купить за деньги нельзя:
# на них играют в дуэли, а ставки на купленную валюту — это азартная игра. Тратятся на дуэли и /donate.

daily:
  # за первый вход дня; каждый следующий день подряд +step, но не больше max
  base: 10
  step: 2
  max: 30
  # день начинается в 00:00 по этому часовому поясу
  zone: "Europe/Moscow"

duel:
  min-stake: 10
  max-stake: 5000
  # сколько процентов от банка (двух ставок) забирает сервер — чтобы жужики не обесценивались
  commission-percent: 5
  # сколько секунд ждать «Принять»
  request-seconds: 60
  # бой дольше — ничья, ставки возвращаются
  max-fight-seconds: 180
  # одна и та же пара — не больше стольких дуэлей за сутки (защита от накрутки)
  pair-per-day: 5
  # дуэли между игроками с одного IP (твинки, «сам с собой») — только для тестов
  allow-same-ip: false
  # одновременных дуэлей (арен)
  arenas: 8

# куда писать данные для сайта (вкладка «Дуэли»); пусто — в папку плагина
export-file: ""

# /donate — ранги за жужики (за рубли — на сайте, кнопка в том же окне). Ранг — временная группа LuckPerms:
# купил ещё раз — дни добавились. Цены за рубли — в shop.json сайта.
donate:
  days: 90
  site: "https://beezzland.ru/shop.html"
  ranks:
    silver:
      title: Silver
      color: "#E2E8F0"
      price: 2000
      perks:
        - "<#E2E8F0>Silver</#E2E8F0>"
        - "<gray>значок в чате и TAB"
        - "<gray>AFK до 4 часов без кика"
        - "<gray>3 свои пластинки за сезон"
    gold:
      title: Gold
      color: "#FCD34D"
      price: 4500
      perks:
        - "<#FCD34D>Gold</#FCD34D> <gray>— всё, что у Silver, и:"
        - "<gray>свой цвет ника (/color)"
        - "<gray>/trade из любого места"
        - "<gray>AFK до 8 часов, 5 пластинок"
    diamond:
      title: Diamond
      color: "#67E8F9"
      price: 8000
      perks:
        - "<#67E8F9>Diamond</#67E8F9> <gray>— всё, что у Gold, и:"
        - "<gray>градиент ника из 2–4 цветов"
        - "<gray>AFK до 12 часов, 7 пластинок"
