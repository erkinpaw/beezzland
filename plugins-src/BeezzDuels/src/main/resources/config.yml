# Жужики — валюта сайта. Только зарабатываются (вход каждый день, ивенты), купить за деньги нельзя:
# на них играют в дуэли, а ставки на купленную валюту — это азартная игра (запрещено Mojang и законом).

daily:
  # за первый вход дня; каждый следующий день подряд +step, но не больше max
  base: 10
  step: 2
  max: 30
  # день начинается в 00:00 по этому часовому поясу
  zone: "Europe/Moscow"

duel:
  min-stake: 10
  max-stake: 5000
  # сколько процентов от банка (двух ставок) забирает сервер — чтобы жужики не обесценивались
  commission-percent: 5
  # сколько секунд ждать «Принять»
  request-seconds: 60
  # бой дольше — ничья, ставки возвращаются
  max-fight-seconds: 180
  # одна и та же пара — не больше стольких дуэлей за сутки (защита от накрутки)
  pair-per-day: 5
  # дуэли между игроками с одного IP (твинки, «сам с собой») — только для тестов
  allow-same-ip: false
  # одновременных дуэлей (арен)
  arenas: 8

# куда писать данные для сайта (вкладка «Дуэли»); пусто — в папку плагина
export-file: ""
