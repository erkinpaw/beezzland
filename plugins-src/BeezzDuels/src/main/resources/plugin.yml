name: BeezzDuels
version: '${version}'
main: land.beezz.duels.BeezzDuels
api-version: '26.3'
description: Жужики (валюта сайта), дуэли на ставку и /donate за жужики
load: POSTWORLD
folia-supported: true

commands:
  duel:
    description: Вызвать игрока на дуэль за жужики
    usage: /duel <ник> <ставка> [diamond|iron|archer] | accept | decline | surrender
  jujik:
    description: Баланс жужиков, топ и выдача за ивенты
    usage: /jujik [top] | give <ник> <сумма> [за что] | take <ник> <сумма>
    aliases: [jujiki, zhuzhiki, zh]

  donate:
    description: Донат-ранги за жужики (за рубли — на сайте)
    aliases: [donat, shop]

permissions:
  beezzduels.admin:
    description: Выдавать и забирать жужики (награды за ивенты)
    default: op
