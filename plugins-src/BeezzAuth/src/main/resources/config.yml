# BeezzAuth — вход на сервер без паролей: аккаунт привязывается к ВК / Telegram / Discord,
# а вход с нового устройства подтверждается кнопкой в боте.

# Сколько часов после входа можно заходить с того же IP без подтверждения.
session-hours: 12
# Сколько секунд игра ждёт нажатия «Это я» на экране загрузки (клиент отваливается примерно через 30).
confirm-timeout-seconds: 25
# Сколько минут действует код привязки.
link-code-minutes: 10
# Если «Это я» нажали уже после того, как игра перестала ждать, вход с этого IP открыт ещё столько минут.
late-approve-minutes: 5

telegram:
  enabled: false
  # токен от @BotFather. Не публикуй его: это пароль от бота.
  token: ""
  # как бота найти игрокам (показывается в сообщении при входе)
  username: "beezzland_bot"
  api-base: "https://api.telegram.org"

vk:
  enabled: false
  # ключ доступа сообщества (Управление → Работа с API), права: сообщения сообщества.
  # В сообществе включить «Сообщения» и Long Poll API (тип событий: входящее сообщение, действие с сообщением).
  token: ""
  group-id: 0
  # как сообщество найти игрокам
  link: "vk.me/beezzland"
  api-base: "https://api.vk.com/method"

discord:
  enabled: false
  # токен бота (Discord Developer Portal → Bot → Reset Token). Бот должен быть добавлен на наш Discord-сервер:
  # писать игрокам в личку он может, только если у них есть общий сервер.
  token: ""
  # куда звать игроков (приглашение на наш Discord)
  link: "discord.gg/beezzland"
  api-base: "https://discord.com/api/v10"
