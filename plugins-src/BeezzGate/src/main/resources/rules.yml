# Тест по правилам перед первым входом. Поменял правила — увеличь version: тест спросят у всех заново.
version: 1

# Полный текст правил: показывается после ошибки, перед повторным тестом (и в игре по /rules — BeezzCore).
rules: |
  1. Не ломай и не воруй чужое — всё откатывается, а ты отправляешься в бан.
  2. Никаких читов, x-ray и модов на преимущество.
  3. Уважай игроков: без оскорблений и рекламы в чате.
  4. Лаг-машины и фермы, роняющие сервер, запрещены.
  5. Строй минимум в 100 блоках от чужих домов.
  6. Нашёл баг — сообщи администрации, а не используй.

# Вопросы по порядку. answer: да / нет — правильный ответ.
questions:
  - text: "Можно ли забрать вещи из чужого сундука, если хозяина нет онлайн?"
    answer: нет
  - text: "Если нашёл баг, нужно сообщить о нём администрации, а не использовать?"
    answer: да
  - text: "Можно ли играть с x-ray, если никому не рассказывать?"
    answer: нет
  - text: "Строить нужно минимум в 100 блоках от чужих домов?"
    answer: да
  - text: "Можно ли построить огромную ферму, если от неё лагает весь сервер?"
    answer: нет
