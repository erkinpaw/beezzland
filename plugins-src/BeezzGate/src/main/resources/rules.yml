# Тест по правилам перед первым входом. Поменял правила — увеличь version: тест спросят у всех заново.
version: 2

# Сколько вопросов задавать: каждый раз случайные из списка ниже, в случайном порядке. 0 — все.
ask: 12

# Краткие правила: показываются перед тестом и после ошибки. Полная версия — docs/RULES.md / сайт.
rules: |
  1. Чужое не трогай: нельзя ломать, воровать и брать чужих питомцев — даже если хозяина нет онлайн.
  2. Без читов: x-ray, поиск руд, миникарты и ресурспаки с подсветкой руды запрещены.
  3. Нашёл баг или дюп — сообщи администрации. Скрыл чужое нарушение — наказание как нарушителю.
  4. Один игрок — один аккаунт. Твинки и игра вдвоём с одного аккаунта запрещены.
  5. Отметь свою территорию (табличка, забор, флаг). Строй не ближе 100 блоков от чужой. Заброшенный дом занимать нельзя.
  6. Убивать игроков можно только по их согласию.
  7. Фермы мобов строй в мире ферм. Портал туда — из блоков пчелиных сот. Лаг-фермы запрещены.
  8. Валюта — ары (алмазная руда). Торговля за реальные деньги запрещена.
  9. В чате без оскорблений, рекламы и политики.

# answer: да / нет — правильный ответ.
questions:
  - text: "Сундук открыт, хозяина нет онлайн. Можно взять из него пару вещей?"
    answer: нет
  - text: "Ты нашёл дюп. Нужно сообщить о нём администрации?"
    answer: да
  - text: "Можно играть с x-ray, если никому не рассказывать?"
    answer: нет
  - text: "Можно играть с миникартой?"
    answer: нет
  - text: "Можно пользоваться ресурспаком, который подсвечивает руду?"
    answer: нет
  - text: "Свою территорию нужно отметить: табличкой, забором или флагом?"
    answer: да
  - text: "Игрок не заходит уже месяц. Можно занять его дом?"
    answer: нет
  - text: "Можно убить игрока без его согласия?"
    answer: нет
  - text: "Портал в мир ферм строится из блоков пчелиных сот?"
    answer: да
  - text: "Можно построить ферму, от которой лагает сервер, если она очень выгодная?"
    answer: нет
  - text: "Валюта сервера — ары, то есть алмазная руда?"
    answer: да
  - text: "Можно продать ары или ресурсы за реальные деньги?"
    answer: нет
  - text: "Можно играть с другом с одного аккаунта по очереди?"
    answer: нет
  - text: "Можно завести второй аккаунт для фермы?"
    answer: нет
  - text: "Друг грифит, а ты молчишь. Тебя тоже могут наказать?"
    answer: да
  - text: "Можно спорить о политике в чате?"
    answer: нет
